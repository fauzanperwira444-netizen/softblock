server {
    listen 8080;
    root /var/www/public;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;

    include /etc/nginx/keamanan.conf;

    # Aset Vite berhash boleh di-cache lama; service worker dan manifest harus selalu segar.
    location /assets/ {
        include /etc/nginx/keamanan.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /sw.js {
        include /etc/nginx/keamanan.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA disajikan nginx langsung. Lewat Laravel, tiap kunjungan dan health check membuka sesi di database
    # dan bisa menghabiskan worker php-fpm sampai health check SnapDeploy gagal.
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        include /etc/nginx/keamanan.conf;
        add_header Cache-Control "no-cache";
    }

    # Hanya rute Laravel yang masuk ke PHP.
    location /api/ {
        try_files $uri /index.php?$query_string;
    }
    location /auth/ {
        try_files $uri /index.php?$query_string;
    }
    location /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
